plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.taobaocoinassistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.local.taobaocoinassistant'
        minSdk 30
        targetSdk 36
        versionCode 107
        versionName '1.2.1'
    }

    // 只出 arm64-v8a：现代安卓手机都是这个架构，其余三种装不上又容易挑错。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        release {
            // 暂时不动 R8，避免影响现在已经稳定的功能
            minifyEnabled false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

// 产物带上版本号，避免装错旧包：TaobaoCoinAssistant-v1.2.1-arm64-v8a-debug.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        def vn = variant.versionName.getOrNull() ?: "unknown"
        variant.outputs.each { output ->
            output.outputFileName.set("TaobaoCoinAssistant-v${vn}-${variant.name}.apk")
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // 兜底：shell 侧反射 InputManager.injectInputEvent 被 hidden API 拦住时用它解禁
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
